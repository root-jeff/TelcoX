services: 
  database:
    build: ./MySql
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=telcox_db
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api: 
    build: .
    command: sh -c "wait-for-it mysql:3306 -- python manage.py migrate && python manage.py shell < ApiTelcoX/initialize_data.py && python manage.py runserver 0.0.0.0:8000"
    volumes: 
      - .:/ApiTelcoX
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  mysql_data: